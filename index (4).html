<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <title>Exam-Quiz</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Exam Quiz Haiti",
      "url": "https://examquizhaiti.com",
      "logo": "https://examquizhaiti.com/icons/icon-192.png"
    }
    </script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #2563eb, #38bdf8);
        color: #0f172a;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 680px;
        margin: 2rem auto;
        background: white;
        padding: 2rem;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      }
      h1 {
        margin-top: 0;
        color: #1d4ed8;
      }
      button {
        display: block;
        width: 100%;
        margin: 0.7rem 0;
        padding: 0.95rem;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: #1d4ed8;
      }
      .progress {
        font-size: 0.95rem;
        color: #64748b;
        margin-bottom: 1rem;
      }
      .result {
        font-weight: bold;
        margin-top: 1rem;
        font-size: 1.1rem;
        color: #0f766e;
      }
      .restart-btn {
        margin-top: 1rem;
        background: #0f766e;
      }
      .restart-btn:hover {
        background: #115e59;
      }
      .ai-panel {
        margin-top: 1.2rem;
        padding: 1rem;
        border-radius: 12px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
      }
      .ai-panel h3 {
        margin-top: 0;
        color: #1d4ed8;
      }
      .ai-panel p {
        margin: 0.3rem 0 0;
        color: #334155;
      }
      .hint-btn {
        background: #7c3aed;
        margin-top: 0.8rem;
      }
      .hint-btn:hover {
        background: #6d28d9;
      }
      .level-btn.locked {
        background: #94a3b8;
        cursor: not-allowed;
      }
      .level-btn.locked:hover {
        background: #94a3b8;
      }
      .badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: #22c55e;
        color: white;
        font-weight: bold;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        text-align: center;
        padding: 2.5rem 1rem;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(34,197,94,0.06), rgba(59,130,246,0.05));
      }
      .hero .illustration {
        width: 220px;
        height: 140px;
        border-radius: 12px;
        background: linear-gradient(135deg, #60a5fa, #34d399);
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow: 0 10px 30px rgba(2,6,23,0.12);
      }
      .hero h2 { margin: 0; color: #0f172a; }
      .start-btn {
        background: #10b981;
        margin-top: 0.6rem;
      }
      .start-btn:hover { background:#059669 }
      .install-btn {
        background: #f59e0b;
        color: white;
        margin-top: 0.6rem;
      }
      .install-btn:hover {
        background: #d97706;
      }
      .levels-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.7rem;
      }
      .level-btn {
        padding: 0.75rem;
        font-size: 0.95rem;
      }
      .reassure {
        color: #064e3b;
        background: rgba(34,197,94,0.06);
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        font-style: italic;
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="logo.png" alt="Exam Quiz Haiti" style="display:block; width:260px; max-width:80%; height:auto; margin: 0 auto 1rem;" />
      <h1>Exam-Quiz</h1>
      <p>Bienvenue dans votre quiz d’entraînement en français.</p>
      <div id="quiz-container"></div>
    </div>

    <script type="module">
      import { createQuiz, selectQuestionsByLevel, answerQuestion, getCurrentQuestion, getLevel, getProgress, getAiHint, getAiFeedback, isFinished, QUESTIONS_PER_LEVEL } from './src/quizLogic.js';
      import { baccQuestions } from './src/baccQuestions.js';

      const questions = baccQuestions;
      const totalLevels = Math.ceil(questions.length / QUESTIONS_PER_LEVEL);
      const unlockThreshold = Math.max(1, QUESTIONS_PER_LEVEL - 1); // score minimum requis pour débloquer le niveau suivant
      const savedUnlockedLevels = JSON.parse(localStorage.getItem('exam_quiz_unlocked_levels') || '[1]');
      const unlockedLevels = new Set(savedUnlockedLevels);

      function saveUnlockedLevels() {
        localStorage.setItem('exam_quiz_unlocked_levels', JSON.stringify(Array.from(unlockedLevels)));
      }
      let selectedLevel = null;
      let quiz = null;
      let showLanding = true;
      // Coins (récompenses)
      let coins = Number(localStorage.getItem('exam_quiz_coins') || 0);
      const levelReward = 5; // pièces accordées par niveau réussi

      function renderLanding() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = `
          <div class="hero">
            <div class="illustration">
              <svg width="140" height="100" viewBox="0 0 140 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="140" height="100" rx="12" fill="url(#g)"/>
                <g fill="white" opacity="0.95">
                  <circle cx="36" cy="50" r="8" />
                  <rect x="56" y="40" width="58" height="20" rx="4" />
                </g>
                <defs>
                  <linearGradient id="g" x1="0" x2="1">
                    <stop offset="0" stop-color="#60A5FA"/>
                    <stop offset="1" stop-color="#34D399"/>
                  </linearGradient>
                </defs>
              </svg>
            </div>
            <h2>Bienvenue sur Exam-Quiz</h2>
            <p>Entraîne-toi par niveaux et débloque les suivants en réussissant.</p>
            <p><strong>Développé par :</strong> Ing. Fawenbert Régis</p>
            <p>Teste tes connaissances, progresse étape par étape et relève les défis.</p>
            <p>Conseil : lis attentivement chaque énoncé et prends ton temps.</p>
            <div class="reassure">
              <p><strong>Pour les élèves NS4 — Rassurez-vous :</strong></p>
              <p>- Prenez une grande respiration avant de commencer.</p>
              <p>- Si vous faites une erreur, ce n’est pas grave : recommencez et apprenez.</p>
              <p>- Jouez en étant concentré : un moment calme aide à mieux retenir.</p>
              <p>- Vous êtes capables — avancez pas à pas et faites confiance à vos connaissances.</p>
            </div>
            <div>Pièces : 🪙 ${coins}</div>
            <button class="start-btn" id="start-btn">Démarrer</button>
            <button class="install-btn" id="install-btn" disabled>Installer l’application</button>
            <p id="install-note" style="margin-top:0.5rem;color:#475569;font-size:0.95rem;">Le bouton sera activé lorsque le navigateur détectera que l’application peut être installée.</p>
          </div>
        `;

        document.getElementById('start-btn').addEventListener('click', () => {
          showLanding = false;
          render();
        });
      }

      function startQuiz(level) {
        const levelQuestions = selectQuestionsByLevel(questions, level);
        return createQuiz(levelQuestions);
      }

      function renderLevelSelection() {
        const container = document.getElementById('quiz-container');
        const levels = Array.from({ length: totalLevels }, (_, index) => index + 1);
        container.innerHTML = `
          <div class="progress">Choisissez un niveau à débloquer :</div>
          <div style="margin-bottom:0.6rem">Vos pièces : 🪙 ${coins}</div>
          <div class="levels-grid">
            ${levels
              .map((level) => {
                const unlocked = unlockedLevels.has(level);
                return `<button class="level-btn${unlocked ? '' : ' locked'}" data-level="${level}" ${unlocked ? '' : 'disabled'}>${unlocked ? `Niveau ${level}` : `Niveau ${level} (verrouillé)`}</button>`;
              })
              .join('')}
          </div>
          <div class="result">Niveau 1 disponible. Terminez chaque niveau pour débloquer le suivant.</div>
        `;

        container.querySelectorAll('.level-btn').forEach((button) => {
          if (button.disabled) {
            return;
          }
          button.addEventListener('click', () => {
            selectedLevel = Number(button.dataset.level);
            quiz = startQuiz(selectedLevel);
            render();
          });
        });
      }

      function render() {
        const container = document.getElementById('quiz-container');
        if (showLanding) {
          renderLanding();
          return;
        }

        if (!quiz) {
          renderLevelSelection();
          return;
        }
        if (quiz.failed) {
          const failedQuestion = getCurrentQuestion(quiz);
          const failedAnswerText = failedQuestion?.options[quiz.failedAnswer] ?? 'Réponse inconnue';
          const correctAnswerText = failedQuestion?.options[failedQuestion?.correctAnswer] ?? 'Réponse correcte inconnue';

          container.innerHTML = `
            <div class="result">Échec du niveau ${selectedLevel}.</div>
            <div class="result">Vous avez choisi : ${failedAnswerText}</div>
            <div class="result">Bonne réponse : ${correctAnswerText}</div>
            <div class="result">Recommencez le niveau pour progresser.</div>
            <button class="restart-btn" id="retry-btn">Recommencer le niveau ${selectedLevel}</button>
            <button class="restart-btn" id="back-btn">Retour aux niveaux</button>
          `;
          document.getElementById('retry-btn').addEventListener('click', () => {
            quiz = startQuiz(selectedLevel);
            render();
          });
          document.getElementById('back-btn').addEventListener('click', () => {
            selectedLevel = null;
            quiz = null;
            render();
          });
          return;
        }

        if (isFinished(quiz)) {
          const nextLevel = selectedLevel + 1;
          const canUnlock = quiz.score >= unlockThreshold;
          let earned = 0;
          if (canUnlock && nextLevel <= totalLevels) {
            unlockedLevels.add(nextLevel);
            saveUnlockedLevels();
            earned = levelReward;
            coins += earned;
            localStorage.setItem('exam_quiz_coins', String(coins));
          }

          container.innerHTML = `
            <div class="result">Quiz terminé ! Niveau choisi : ${selectedLevel}</div>
            <div class="result">Votre score : ${quiz.score}/${quiz.questions.length}</div>
            <div class="result">${getLevel(quiz.score, quiz.questions.length)}</div>
            ${canUnlock && nextLevel <= totalLevels ? `<div class="badge">Niveau ${selectedLevel} terminé et niveau ${nextLevel} débloqué !</div>` : `<div class="badge" style="background:#f59e0b;">Score nécessaire : ${unlockThreshold}/5 pour débloquer le niveau suivant.</div>`}
            ${earned > 0 ? `<div style="margin-top:0.6rem">Vous gagnez ${earned} pièces ! 🪙</div>` : ''}
            <div style="margin-top:0.6rem">Total pièces : 🪙 ${coins}</div>
            <button class="restart-btn" id="restart-btn">Revenir aux niveaux</button>
          `;
          document.getElementById('restart-btn').addEventListener('click', () => {
            selectedLevel = null;
            quiz = null;
            render();
          });
          return;
        }

        const question = getCurrentQuestion(quiz);
        container.innerHTML = `
          <div class="progress">Niveau ${selectedLevel} — ${getProgress(quiz)}</div>
          <h2>${question.question}</h2>
          ${question.options.map((option, index) => `<button data-index="${index}">${option}</button>`).join('')}
          <div class="ai-panel">
            <h3>Assistant IA</h3>
            <p id="ai-feedback">${getAiHint(question)}</p>
            <button class="hint-btn" id="hint-btn">Demander un conseil</button>
          </div>
        `;

        container.querySelectorAll('button').forEach((button) => {
          if (button.id === 'hint-btn') {
            button.addEventListener('click', () => {
              const feedback = document.getElementById('ai-feedback');
              feedback.textContent = getAiHint(question);
            });
            return;
          }

          button.addEventListener('click', () => {
            const selectedIndex = Number(button.dataset.index);
            const feedback = document.getElementById('ai-feedback');
            feedback.textContent = getAiFeedback(question, selectedIndex);
            const isCorrect = selectedIndex === question.correctAnswer;
            if (!isCorrect) {
              quiz = {
                ...quiz,
                failed: true,
                failedAnswer: selectedIndex,
              };
              render();
              return;
            }
            quiz = answerQuestion(quiz, selectedIndex);
            setTimeout(render, 400);
          });
        });
      }

      let deferredPrompt = null;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        showInstallButton();
      });

      function hideInstallButton() {
        const installBtn = document.getElementById('install-btn');
        const installNote = document.getElementById('install-note');
        if (installBtn) {
          installBtn.disabled = true;
        }
        if (installNote) {
          installNote.textContent = 'Le navigateur n’a pas encore autorisé l’installation de la PWA.';
        }
      }

      function showInstallButton() {
        const installBtn = document.getElementById('install-btn');
        const installNote = document.getElementById('install-note');
        if (installBtn) {
          installBtn.disabled = false;
          installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
              return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              console.log('PWA installée.');
            }
            deferredPrompt = null;
            hideInstallButton();
          }, { once: true });
        }
        if (installNote) {
          installNote.textContent = 'Cliquez sur le bouton pour installer l’application.';
        }
      }

      render();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch((error) => {
            console.warn('Service worker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
