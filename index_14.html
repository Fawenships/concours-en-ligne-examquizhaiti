<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14163B">
<title>Konkou — Joue pour Gagner</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- ÉCRAN D'ACCUEIL -->
  <section id="screen-home" class="screen active">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <header class="topbar">
      <span class="wordmark">KONKOU</span>
      <div class="ticket-pill">
        <span class="ticket-dot"></span>
        <span id="ticket-count">3</span> tickets
      </div>
    </header>

    <h1 class="headline">Tu crois<br>tout savoir<span class="dot">?</span></h1>
    <p class="subline">Choisis un thème. 15 secondes par question. Prouve-le.</p>

    <div id="category-list" class="category-grid"></div>
  </section>

  <!-- ÉCRAN QUIZ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-header">
      <button id="btn-quit" class="btn-quit" aria-label="Quitter">←</button>
      <span id="quiz-progress" class="quiz-progress">Q1/5</span>
      <div class="timer-ring">
        <svg viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="26"></circle>
          <circle id="ring-fg" class="ring-fg" cx="30" cy="30" r="26"></circle>
        </svg>
        <span id="timer" class="timer-num">15</span>
      </div>
    </div>

    <span id="quiz-category" class="quiz-tag"></span>
    <h2 id="quiz-question" class="quiz-question">—</h2>

    <div id="quiz-choices" class="choice-grid"></div>

    <div class="score-strip">Score : <strong id="quiz-score">0</strong></div>
  </section>

  <!-- ÉCRAN RÉSULTAT -->
  <section id="screen-result" class="screen">
    <span class="result-eyebrow" id="result-eyebrow">Résultat</span>
    <div class="result-score-wrap">
      <span id="result-score" class="result-score">0</span>
      <span class="result-slash">/</span>
      <span id="result-total" class="result-total">0</span>
    </div>
    <p id="result-message" class="result-message"></p>

    <div class="result-actions">
      <button id="btn-replay" class="btn-primary">Rejouer</button>
      <button id="btn-home" class="btn-secondary">Autres thèmes</button>
    </div>
  </section>

</div>

<script src="js/quiz.js"></script>
</body>
</html>
