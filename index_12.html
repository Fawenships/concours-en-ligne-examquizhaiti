<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konkou — Joue pour Gagner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101A3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- ÉCRAN D'ACCUEIL -->
  <section id="screen-home" class="screen active">
    <header class="brand">
      <span class="brand-mark">KONKOU</span>
      <span class="brand-tag">joue · réponds · gagne</span>
    </header>

    <div class="ticket-bar">
      <span class="ticket-icon">🎟️</span>
      <span id="ticket-count">3</span>
      <span class="ticket-label">tickets aujourd'hui</span>
    </div>

    <h1 class="hero-title">Que sais-tu vraiment ?</h1>
    <p class="hero-sub">Choisis une catégorie, réponds à temps, grimpe au classement.</p>

    <div id="category-list" class="category-list"></div>
  </section>

  <!-- ÉCRAN QUIZ -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button id="btn-quit" class="btn-ghost" aria-label="Quitter la partie">✕</button>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="timer" id="timer">15</div>
    </div>

    <div class="quiz-body">
      <span id="quiz-category" class="quiz-category"></span>
      <h2 id="quiz-question" class="quiz-question">—</h2>
      <div id="quiz-choices" class="quiz-choices"></div>
    </div>

    <div class="score-line">Points : <span id="quiz-score">0</span></div>
  </section>

  <!-- ÉCRAN RÉSULTAT -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <span class="result-eyebrow">Terminé !</span>
      <h1 id="result-score" class="result-score">0</h1>
      <p class="result-label">points sur <span id="result-total">0</span></p>
      <p id="result-message" class="result-message"></p>
      <div class="result-actions">
        <button id="btn-replay" class="btn-primary">Rejouer</button>
        <button id="btn-home" class="btn-secondary">Retour à l'accueil</button>
      </div>
    </div>
  </section>

</div>

<script src="js/quiz.js"></script>
</body>
</html>
