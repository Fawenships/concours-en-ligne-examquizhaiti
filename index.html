<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #eff6ff, #f5f3ff);
  color: #0f172a;
}

.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 20px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  margin-bottom: 25px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(15, 23, 42, .08);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  font-size: 25px;
}

.logo strong {
  display: block;
  font-size: 20px;
}

.logo small {
  display: block;
  color: #64748b;
  margin-top: 3px;
}

.tickets {
  padding: 10px 15px;
  border-radius: 12px;
  background: #eff6ff;
  color: #2563eb;
  font-weight: bold;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* ACCUEIL */

.hero {
  padding: 45px 25px;
  margin-bottom: 30px;
  text-align: center;
  color: white;
  border-radius: 25px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  box-shadow: 0 15px 35px rgba(37, 99, 235, .25);
}

.hero-icon {
  font-size: 55px;
  margin-bottom: 15px;
}

.hero h1 {
  font-size: 32px;
  margin-bottom: 12px;
}

.hero p {
  max-width: 600px;
  margin: 0 auto 20px;
  line-height: 1.6;
}

.ticket-info {
  display: inline-block;
  padding: 10px 15px;
  border-radius: 12px;
  background: rgba(255,255,255,.18);
}

.section-title {
  margin-bottom: 15px;
}

.section-title h2 {
  font-size: 23px;
}

.section-title p {
  margin-top: 5px;
  color: #64748b;
}

/* CATÉGORIES */

.category-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.category-grid button {
  min-height: 85px;
  padding: 20px;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  background: white;
  color: #0f172a;
  text-align: left;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(15,23,42,.06);
  transition: .2s;
}

.category-grid button:hover {
  transform: translateY(-4px);
  border-color: #2563eb;
}

.category-grid button span {
  display: block;
}

.category-grid .cat-count {
  margin-top: 8px;
  color: #64748b;
  font-size: 13px;
  font-weight: normal;
}

.category-grid .paid-contest-btn {
  grid-column: 1 / -1;
  border: none;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  color: white;
}

.category-grid .paid-contest-btn .cat-count {
  color: white;
}

/* BOUTONS */

.start-btn {
  width: 100%;
  padding: 14px 20px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.start-btn:hover {
  opacity: .9;
  transform: translateY(-2px);
}

.restart-btn {
  width: 100%;
  margin-top: 10px;
  padding: 13px 20px;
  border: 1px solid #e2e8f0;
  border-radius: 13px;
  background: white;
  color: #0f172a;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

/* PAIEMENT */

.payment-box {
  max-width: 550px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 22px;
  background: white;
  box-shadow: 0 10px 30px rgba(15,23,42,.08);
}

.payment-box h2 {
  font-size: 26px;
  margin-bottom: 8px;
}

.payment-sub {
  color: #64748b;
  line-height: 1.5;
  margin-bottom: 25px;
}

.payment-summary {
  padding: 15px;
  margin-bottom: 25px;
  background: #f8fafc;
  border-radius: 15px;
}

.payment-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #e2e8f0;
}

.payment-row:last-child {
  border-bottom: none;
}

.payment-row-total {
  color: #2563eb;
  font-size: 18px;
}

.payment-label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

.payment-input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

.payment-input:focus {
  border-color: #2563eb;
}

.payment-status {
  min-height: 20px;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.payment-status.error {
  color: #dc2626;
}

.payment-status.success {
  color: #16a34a;
}

/* QUIZ */

.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-weight: bold;
}

#timer {
  width: 42px;
  height: 42px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  background: #dbeafe;
  color: #2563eb;
  font-weight: bold;
}

#timer.low {
  background: #fee2e2;
  color: #dc2626;
}

.progress-track {
  height: 8px;
  margin-bottom: 25px;
  overflow: hidden;
  border-radius: 20px;
  background: #e2e8f0;
}

.progress-fill {
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, #2563eb, #7c3aed);
  transition: width .3s;
}

.quiz-category {
  display: inline-block;
  padding: 7px 12px;
  margin-bottom: 12px;
  border-radius: 20px;
  background: #ede9fe;
  color: #6d28d9;
  font-size: 13px;
  font-weight: bold;
}

#quiz-question {
  padding: 25px;
  margin-bottom: 18px;
  border-radius: 18px;
  background: white;
  font-size: 23px;
  line-height: 1.4;
  box-shadow: 0 8px 25px rgba(15,23,42,.08);
}

.quiz-choices {
  display: grid;
  gap: 12px;
}

.quiz-choices button {
  width: 100%;
  padding: 16px;
  border: 2px solid #e2e8f0;
  border-radius: 14px;
  background: white;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
}

.quiz-choices button:hover:not(:disabled) {
  border-color: #2563eb;
  background: #eff6ff;
}

.quiz-choices button.correct {
  border-color: #16a34a;
  background: #dcfce7;
  color: #166534;
}

.quiz-choices button.wrong {
  border-color: #dc2626;
  background: #fee2e2;
  color: #991b1b;
}

.score-line {
  margin: 20px 0;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

/* RÉSULTAT */

.result-box {
  max-width: 600px;
  margin: 30px auto;
  padding: 35px 25px;
  border-radius: 24px;
  background: white;
  text-align: center;
  box-shadow: 0 10px 30px rgba(15,23,42,.08);
}

.result-icon {
  font-size: 65px;
  margin-bottom: 10px;
}

.result-box h2 {
  margin-bottom: 15px;
  font-size: 30px;
}

.result-score {
  margin-bottom: 15px;
  color: #64748b;
  font-size: 20px;
}

.result-score strong {
  display: block;
  margin-top: 5px;
  color: #2563eb;
  font-size: 48px;
}

.result-badge {
  display: inline-block;
  padding: 8px 15px;
  margin-bottom: 20px;
  border-radius: 20px;
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  color: white;
  font-weight: bold;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px 0;
}

.result-stat {
  flex: 1;
  padding: 15px;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  background: #f8fafc;
}

.result-stat span {
  display: block;
  margin-bottom: 5px;
  color: #64748b;
  font-size: 13px;
}

.result-stat strong {
  font-size: 20px;
}

.result-message {
  margin: 15px 0 25px;
  color: #64748b;
}

/* CLASSEMENT */

.contest-standings {
  padding: 18px;
  margin-bottom: 20px;
  border-radius: 16px;
  background: #f8fafc;
  text-align: left;
}

.standing-row {
  display: grid;
  grid-template-columns: 40px 1fr 70px 80px;
  gap: 5px;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  background: white;
}

.standing-rank {
  color: #2563eb;
  font-weight: bold;
}

.standing-score {
  font-weight: bold;
}

.standing-prize {
  color: #16a34a;
  font-weight: bold;
}

/* MOBILE */

@media (max-width: 650px) {

  .app {
    padding: 12px;
  }

  .category-grid {
    grid-template-columns: 1fr;
  }

  .category-grid .paid-contest-btn {
    grid-column: auto;
  }

  .hero h1 {
    font-size: 26px;
  }

  #quiz-question {
    font-size: 20px;
  }

  .result-stats {
    flex-direction: column;
  }
}
</style>
