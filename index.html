   CARDS
========================= */

.card{

}

.secondary{

}

.quiz-choices{
    display:grid;

}

.quiz-choices button{
    padding:16px;
    border:2px solid #e2e8f0;
    background:white;
    border-radius:13px;
    text-align:left;
}

.quiz-choices button.correct{
    background:#dcfce7;
    border-color:#22c55e;
}

.quiz-choices button.wrong{

.score-line{

.result-stats div{

.result-stats strong{

.result-message{

}
